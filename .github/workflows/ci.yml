name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: OpenAPI document is current
        run: |
          pnpm openapi
          git diff --exit-code -- docs/api/openapi.json

  test-postgres:
    name: Test against PostgreSQL (true concurrency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sportspark
          POSTGRES_PASSWORD: sportspark
          POSTGRES_DB: sportspark_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sportspark -d sportspark_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://sportspark:sportspark@localhost:5432/sportspark_test
